[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "trivy-scanner-api"
version = "2.1.0"
description = "Self-hosted Trivy scanning as a service, plus a CI client to call it."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "hmitsis-dev" }]
keywords = ["trivy", "security", "vulnerability", "scanner", "ci", "fastapi", "devsecops"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
# The base install is the lightweight CI client; the service is an extra.
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "python-multipart>=0.0.9"]
s3 = ["boto3>=1.34"]
oidc = ["PyJWT[crypto]>=2.8"]
ai = ["llama-cpp-python>=0.2.80"]
all = ["trivy-scanner-api[server,s3,oidc]"]
dev = ["trivy-scanner-api[server,s3,oidc]", "pytest>=8", "ruff>=0.6"]

[project.scripts]
trivy-scan = "trivy_scanner.client:main"
trivy-scanner-server = "trivy_scanner.server:main"

[project.urls]
Homepage = "https://github.com/hmitsis-dev/trivy-scanner-dockerized"
Issues = "https://github.com/hmitsis-dev/trivy-scanner-dockerized/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/trivy_scanner"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = [
    "B008",  # FastAPI dependency defaults (File(...), Depends(...))
    "S104",  # binding to 0.0.0.0 is intended inside the container
    "S603",  # subprocess with a validated argument list
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S108"]
